<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMP — Login</title>
  <link rel="stylesheet" href="index-hub.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="theme-toggle.css">
</head>
<body>
  <main class="login-card">
    <div class="login-brand">COMP Tools</div>
    <p class="login-subtitle">Sign in untuk mengakses workspace.</p>

    <form id="loginForm" autocomplete="on">
      <div class="login-field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required maxlength="100">
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
      </div>

      <p id="loginStatus" class="login-status" role="alert" aria-live="polite"></p>
      <button id="loginButton" class="login-button" type="submit">Login</button>
    </form>
  </main>

  <script src="google-sheets-config.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
  <script src="theme-toggle.js"></script>
</body>
</html>
