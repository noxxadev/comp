<!DOCTYPE html>
<html lang="id" data-auth-page="guest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMP — Login</title>
  <link rel="stylesheet" href="index-hub.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="theme-toggle.css">
  <script src="google-sheets-config.js"></script>
  <script src="auth.js"></script>
  <script src="page-guard.js"></script>
</head>
<body>
  <main class="login-card">
    <div class="login-brand">COMP Tools</div>
    <p class="login-subtitle">Sign in untuk mengakses workspace.</p>

    <form id="loginForm" autocomplete="on">
      <div class="login-field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required maxlength="100">
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <div class="password-input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
          <button id="passwordToggle" class="password-toggle" type="button" aria-label="Tampilkan password" aria-pressed="false" title="Tampilkan password">
            <i class="fas fa-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <p id="loginStatus" class="login-status" role="alert" aria-live="polite"></p>
      <button id="loginButton" class="login-button" type="submit">
        <span class="login-button-content">
          <span id="loginSpinner" class="login-spinner" aria-hidden="true"></span>
          <span id="loginButtonText">Login</span>
        </span>
      </button>
    </form>
  </main>

  <script src="login.js"></script>
  <script src="theme-toggle.js"></script>
</body>
</html>
